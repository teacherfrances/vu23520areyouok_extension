<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Are You OK? Speak and Record</title>
<style>
:root{
  --navy:#0b2e4f; --navy2:#12293f; --teal:#0f7d7d; --tealdk:#0b5f5f; --tealtint:#e4f2f2;
  --orange:#c97a1a; --orangetint:#fdf3e0; --orangelt:#f2c98a;
  --green:#1c7a3e; --greentint:#e7f4ec; --red:#b3261e; --redtint:#fbeceb;
  --cream:#f6f2ea; --card:#fff; --line:#e3ddd0; --grey:#5a6772; --focus:#1a73b8;
  --panel:#f5f7f9; --fs:24px;
  --disp:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --num:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
body.t30{--fs:30px}
body.t36{--fs:36px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); font-size:var(--fs); line-height:1.45;
  color:var(--navy); background:var(--cream);
  padding-top:calc(var(--fs)*3.1); padding-bottom:calc(var(--fs)*3.6);
}
button{font-family:var(--body);font-size:1em;color:inherit;cursor:pointer}

/* ---------- top bar ---------- */
#bar{
  position:fixed;top:0;left:0;right:0;z-index:40;background:var(--navy);color:#fff;
  min-height:calc(var(--fs)*3.1);display:flex;align-items:center;gap:.35em;
  padding:.3em .5em;padding-top:calc(.3em + env(safe-area-inset-top));
}
#bar .bt{
  background:#153f66;border:2px solid #2b5c86;color:#fff;border-radius:.5em;
  padding:.3em .6em;font-size:.72em;font-weight:700;min-height:calc(var(--fs)*1.9);
}
#bar .bt:active{background:#0a2337}
#bar .ttl{
  flex:1;min-width:0;font-family:var(--disp);font-weight:900;color:var(--orangelt);
  font-size:.8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .2em;
}
#bar .pill{
  background:#fff;color:var(--navy);border-radius:1em;padding:.18em .6em;
  font-family:var(--num);font-size:.68em;font-weight:700;white-space:nowrap;
}

/* ---------- bottom bar ---------- */
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;
  border-top:3px solid var(--line);padding:.35em .5em;
  padding-bottom:calc(.35em + env(safe-area-inset-bottom));
}
#nav .tip{font-size:.66em;color:var(--grey);margin:0 0 .25em;min-height:1.1em}
#nav .row{display:flex;gap:.5em}
#nav button{
  flex:1;min-height:calc(var(--fs)*2.6);border-radius:.6em;border:3px solid var(--navy);
  background:#fff;color:var(--navy);font-weight:700;font-size:.8em;
}
#nav button.go{background:var(--navy);color:#fff}
#nav button.wait{background:var(--orangetint);border-color:var(--orange);color:#7a4a06}
#nav button.done{background:var(--green);border-color:var(--green);color:#fff}
#nav button[disabled]{opacity:.4}

/* ---------- layout ---------- */
.wrap{max-width:900px;margin:0 auto;padding:.8em .7em 1.2em}
h1{font-family:var(--disp);font-weight:900;font-size:1.35em;line-height:1.15;margin:.1em 0 .3em}
h2{font-family:var(--disp);font-weight:900;font-size:1.05em;margin:1.1em 0 .4em}
p{margin:.4em 0}
.eyebrow{
  font-size:.62em;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tealdk);margin:0 0 .2em
}
.sub{font-size:.78em;color:var(--grey);margin:.2em 0 .6em}
.grouphead{
  font-size:.66em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tealdk);margin:1em 0 .4em;padding-bottom:.2em;border-bottom:3px solid var(--tealtint)
}

/* ---------- menu cards ---------- */
.mcard{
  display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);
  border-left:10px solid var(--teal);border-radius:.7em;padding:.6em .7em;margin:0 0 .55em;
  min-height:calc(var(--fs)*2.8)
}
.mcard.mic{border-left-color:var(--orange)}
.mcard:active{background:var(--tealtint)}
.mcard .step{display:block;font-size:.6em;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tealdk)}
.mcard .name{display:block;font-family:var(--disp);font-weight:900;font-size:.92em;margin:.1em 0}
.mcard .desc{display:block;font-size:.72em;color:var(--grey);line-height:1.35}
.mcard .score{
  display:inline-block;margin-top:.35em;font-family:var(--num);font-size:.66em;font-weight:700;
  background:var(--panel);border:2px solid var(--line);border-radius:1em;padding:.15em .6em
}
.mcard .score.part{background:var(--orangetint);border-color:var(--orange);color:#7a4a06}
.mcard .score.full{background:var(--greentint);border-color:var(--green);color:var(--green)}

/* ---------- panels ---------- */
.panel{background:var(--card);border:3px solid var(--line);border-radius:.7em;padding:.7em .8em;margin:.6em 0}
.panel h3{font-family:var(--disp);font-weight:900;font-size:.9em;margin:0 0 .3em}
.panel p,.panel li{font-size:.78em}
.panel ul{margin:.3em 0;padding-left:1.1em}
.callout{background:var(--orangetint);border:3px solid var(--orange);border-radius:.7em;padding:.6em .75em;margin:.6em 0}
.callout .lead{font-weight:700;color:#7a4a06;display:block;margin-bottom:.15em;font-size:.82em}
.callout p{font-size:.76em;margin:.2em 0}
.tealbox{background:var(--tealtint);border:3px solid var(--teal);border-radius:.7em;padding:.6em .75em;margin:.6em 0}
.tealbox p{font-size:.78em}

/* ---------- part header ---------- */
.rhead{background:var(--navy);color:#fff;border-radius:.7em;padding:.7em .8em;margin:.2em 0 .7em}
.rhead .k{display:block;font-size:.62em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orangelt)}
.rhead h1{color:#fff;font-size:1.1em;margin:.1em 0 .2em}
.rhead .d{font-size:.74em;color:#d5e4f0;line-height:1.35}
.rhead .live{
  display:inline-block;margin-top:.45em;background:#fff;color:var(--navy);border-radius:1em;
  padding:.2em .7em;font-family:var(--num);font-size:.66em;font-weight:700
}
.pbar{display:block;height:.5em;background:#153f66;border-radius:1em;margin-top:.5em;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orangelt);width:0}

/* ---------- item cards ---------- */
.card{background:var(--card);border:3px solid var(--line);border-left:10px solid var(--line);border-radius:.7em;padding:.65em .75em;margin:0 0 .7em}
.card.ok{border-left-color:var(--green)}
.card.no{border-left-color:var(--red)}
.card.flash{animation:fl .9s ease-in-out 2}
@keyframes fl{0%,100%{background:#fff}50%{background:var(--orangetint)}}
.chead{display:flex;align-items:center;gap:.4em;margin-bottom:.35em}
.num{background:var(--navy);color:#fff;font-family:var(--num);font-weight:700;font-size:.62em;border-radius:.4em;padding:.15em .5em}
.tag{font-size:.6em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.q{font-size:.88em;font-weight:700;margin:.15em 0 .5em;line-height:1.35}
.qs{font-size:.78em;color:var(--grey);margin:-.25em 0 .5em;line-height:1.35}
.opt{
  display:block;width:100%;text-align:left;background:var(--panel);border:3px solid var(--line);
  border-radius:.6em;padding:.5em .7em;margin:0 0 .45em;min-height:calc(var(--fs)*2.6);font-size:.82em;line-height:1.3
}
.opt:active{background:var(--tealtint)}
.opt.pick{border-color:var(--navy);background:var(--tealtint)}
.opt.right{border-color:var(--green);background:var(--greentint);font-weight:700}
.opt.wrong{border-color:var(--red);background:var(--redtint)}
.opt[disabled]{opacity:.85}
.chip{
  display:inline-block;background:#fff;border:3px solid var(--teal);border-radius:1.4em;
  padding:.35em .8em;margin:0 .4em .45em 0;font-size:.78em;min-height:calc(var(--fs)*1.9);font-weight:700
}
.chip.used{opacity:.35;border-color:var(--line);color:var(--grey)}
.chip.right{border-color:var(--green);background:var(--greentint)}
.chip.wrong{border-color:var(--red);background:var(--redtint)}
.built{background:var(--panel);border:3px dashed var(--line);border-radius:.6em;padding:.5em .6em;margin:0 0 .5em;font-size:.8em;min-height:calc(var(--fs)*2.2)}
.built .bi{display:block;padding:.15em 0;border-bottom:1px solid var(--line)}
.built .bi:last-child{border-bottom:0}
.fb{border-radius:.6em;padding:.5em .7em;margin:.35em 0 0;font-size:.78em;line-height:1.35}
.fb .lead{display:block;font-weight:700;margin-bottom:.1em}
.fb.good{background:var(--greentint);border:3px solid var(--green);color:#0e4c26}
.fb.bad{background:var(--redtint);border:3px solid var(--red);color:#7c1a15}
.fb.info{background:var(--tealtint);border:3px solid var(--teal);color:var(--tealdk)}
.mini{
  background:#fff;border:3px solid var(--navy);border-radius:.5em;padding:.3em .7em;
  font-size:.7em;font-weight:700;margin:.4em .4em 0 0;min-height:calc(var(--fs)*1.9)
}
.mini.amb{border-color:var(--orange);color:#7a4a06;background:var(--orangetint)}
.big{
  display:block;width:100%;background:var(--teal);color:#fff;border:3px solid var(--tealdk);
  border-radius:.6em;padding:.55em;font-size:.85em;font-weight:700;margin:.5em 0;
  min-height:calc(var(--fs)*2.6)
}
.big.amb{background:var(--orange);border-color:#9a5c0d}
.big.red{background:var(--red);border-color:#7c1a15}
.big.gy{background:#fff;color:var(--navy);border-color:var(--navy)}
.big[disabled]{opacity:.45}

/* ---------- audio ---------- */
.audio{background:var(--navy);color:#fff;border-radius:.7em;padding:.7em .8em;margin:.2em 0 .8em}
.audio .cap{display:block;font-size:.68em;color:var(--orangelt);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.audio .nm{font-family:var(--disp);font-weight:900;font-size:.95em;margin:.15em 0 .4em}
.audio .rw{display:flex;gap:.45em;flex-wrap:wrap}
.audio button{
  flex:1;min-width:6em;background:#fff;color:var(--navy);border:3px solid #fff;border-radius:.6em;
  padding:.4em;font-weight:700;font-size:.76em;min-height:calc(var(--fs)*2.3)
}
.audio button.off{background:#153f66;color:#fff;border-color:#2b5c86}
.audio .note{font-size:.66em;color:#d5e4f0;margin-top:.4em;line-height:1.35}
.meter{height:.7em;background:#153f66;border-radius:1em;overflow:hidden;margin-top:.5em}
.meter i{display:block;height:100%;width:0;background:var(--orangelt)}
.rec{background:#fff;border:3px solid var(--orange);border-radius:.7em;padding:.7em .8em;margin:.6em 0}
.rec .st{font-family:var(--num);font-size:.72em;font-weight:700;color:#7a4a06}
.rec .dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--red);margin-right:.35em;animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.tick{list-style:none;padding:0;margin:.3em 0}
.tick li{font-size:.78em;padding:.2em 0 .2em 1.4em;position:relative;line-height:1.35}
.tick li:before{content:"\2713";position:absolute;left:0;color:var(--teal);font-weight:700}

/* ---------- tap keyboard ---------- */
.kb{display:flex;flex-wrap:wrap;gap:.3em;margin:.5em 0}
.kb button{
  flex:1 0 calc(20% - .3em);min-height:calc(var(--fs)*2.2);border:3px solid var(--line);
  background:#fff;border-radius:.5em;font-weight:700;font-size:.78em
}
.kb button.wide{flex:1 0 calc(40% - .3em)}
.kb button:active{background:var(--tealtint)}
.kbout{
  font-family:var(--num);font-size:.9em;font-weight:700;background:var(--panel);
  border:3px solid var(--line);border-radius:.5em;padding:.45em .6em;min-height:calc(var(--fs)*1.9);
  word-break:break-all
}

/* ---------- tables and results ---------- */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.gt{border-collapse:collapse;width:100%;font-size:.72em;margin:.4em 0}
table.gt th{background:var(--navy);color:#fff;text-align:left;padding:.35em .5em;font-weight:700}
table.gt td{border:1px solid var(--line);padding:.35em .5em;vertical-align:top}
table.gt tr:nth-child(even) td{background:var(--panel)}
.bigscore{font-family:var(--disp);font-weight:900;font-size:2.4em;color:var(--teal);text-align:center;margin:.2em 0 0}
.bandtxt{text-align:center;font-size:.85em;margin:.1em 0 .6em}
.codebox{
  font-family:var(--num);font-weight:700;font-size:1.05em;letter-spacing:.12em;text-align:center;
  background:var(--navy);color:#fff;border-radius:.6em;padding:.55em .3em;margin:.5em 0;word-break:break-all
}
.jump{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--fs)*4.1);z-index:45;
  background:var(--orange);color:#fff;border:3px solid #9a5c0d;border-radius:1.6em;
  padding:.45em 1em;font-weight:700;font-size:.76em;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none
}
.jump.on{display:block}
.hidden{display:none}
.warn{background:var(--redtint);border:3px solid var(--red);border-radius:.6em;padding:.55em .7em;margin:.5em 0;font-size:.76em;color:#7c1a15}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bar">
  <button class="bt" id="bMenu" type="button">Menu</button>
  <span class="ttl" id="bTitle">Are You OK?</span>
  <span class="pill" id="bPill">0 / 0</span>
  <button class="bt" id="bText" type="button">Aa</button>
  <button class="bt" id="bFull" type="button">Full</button>
</div>
<main id="main"></main>
<button class="jump" id="jump" type="button"></button>
<div id="nav">
  <div class="tip" id="navTip"></div>
  <div class="row">
    <button type="button" id="navBack">Back</button>
    <button type="button" id="navNext" class="go">Next</button>
  </div>
</div>
<script>
/* ============================================================
   1. AUDIO CLIP REGISTRY
   Paste a base64 mp3 data URI between the quotes to embed a
   recording. While a slot is empty the page reads the script
   out loud with the device voice instead.
   ============================================================ */
var CLIPS = {
  talk: "",   /* ruok-01-talk.mp3            Grace at the community centre */
  presA: "",  /* ruok-02-presentation-A.mp3  the one that needs work       */
  presB: "",  /* ruok-03-presentation-B.mp3  the good one, Alan            */
  presC: ""   /* ruok-04-presentation-C.mp3  the second good one, Julia    */
};

var SCRIPTS = {
  talk: "Hello everyone. My name is Grace. I work at the community centre in Crows Nest. Today I want to tell you about R U OK? Day. R U OK? Day is on Thursday the tenth of September. It is a national day in Australia. On this day we ask the people around us one simple question: Are you OK? Sometimes a friend is not OK. Maybe the person is very quiet. Maybe the person is tired every day. Maybe the person does not come to class. These are small changes, but they are important. When you notice a change, you can start a conversation. You do not need to be an expert. You are not a doctor. You are a friend, and a friend listens. There are four steps. First, ask. Say: Are you OK? Second, listen. Do not talk about yourself. Third, encourage action. Ask: Who can help you? Say: You could talk to your doctor. And fourth, check in. Ask the person again next week. The colour for R U OK? Day is yellow. Many people wear something yellow on that day. Remember, you can ask on any day. You do not need to wait for September. If you are worried about someone, you can call Lifeline on 13 11 14. Thank you for listening.",
  presA: "Hi. OK so, the steps. You listen to the person. Um, ask the question. Also check in, maybe next week or something. And, um, encourage action, you know, the doctor and things. Yeah. Ask them, that is the first one, sorry, I said that already. There are some more but I think that is enough. Yeah so that is it.",
  presB: "Good morning everyone. My name is Alan. Today I will tell you how to check in on a friend. There are five steps. First, you should choose a quiet place. A quiet place is important. Nobody hears you there. Second, you must ask a simple question. Say: Are you OK? Three words are enough. Third, you need to listen. This step is the most important step. Do not talk about yourself. Let your friend talk. Fourth, you could encourage action. Say: Who can help you? You could say: You should talk to your doctor. And fifth, you must check in again next week. One week is not a long time, but it shows you remember. So, five steps: choose a quiet place, ask, listen, encourage action, and check in again. The most important step is number three. Listen. Thank you for listening. Are there any questions?",
  presC: "Good afternoon everyone. My name is Julia. Today I will tell you how to be a good listener. There are five steps. First, you must put your phone away. A phone in your hand says: I am not listening. Second, you should sit down. When you stand up, your friend feels the talk is short. Third, you need to say nothing for ten seconds. Ten seconds is a long time, and it gives your friend time to think. Fourth, you should ask one small question. Say: How long do you feel like this? And fifth, you must say thank you. Say: Thank you for telling me. So, five steps: phone away, sit down, wait, ask one question, and say thank you. Step three is the hard one. Wait, and say nothing. Thank you for listening. Are there any questions?"
};

/* ============================================================
   2. THE PARTS
   ============================================================ */
var PARTS = [
{ n:1, group:"The words", title:"The words you need", style:"Words",
  desc:"Ten words for talking about a friend. Choose the meaning, then use the word.",
  items:[
  {t:"mcq",q:"What does notice mean?",opts:["to see that something is different","to say words that help a person do something","to ask a person again some days later"],ans:"to see that something is different",why:"First you notice, then you ask. Your eyes see the change before your mouth says anything."},
  {t:"mcq",q:"What does encourage mean?",opts:["to say words that help a person do something","to see that something is different","help that you give to a person"],ans:"to say words that help a person do something",why:"Encourage action is step three. You say: Who can help you?"},
  {t:"mcq",q:"What does check in mean?",opts:["to ask a person again some days later","to call a doctor for a friend","to talk about your own week"],ans:"to ask a person again some days later",why:"Check in is the last step. You come back next week and you ask again."},
  {t:"mcq",q:"What is a helpline?",opts:["a phone number you can call for help","a person who works at a community centre","a long talk between two friends"],ans:"a phone number you can call for help",why:"Lifeline is a helpline. The number is 13 11 14."},
  {t:"mcq",q:"My friend is usually happy and busy. This week my friend is very ______ .",opts:["quiet","worried","support"],ans:"quiet",why:"Quiet means not talking much. It is a change other people can see."},
  {t:"mcq",q:"I am ______ about my neighbour. Nobody sees this person now.",opts:["worried","quiet","noticed"],ans:"worried",why:"Worried is a feeling. You think about a problem and you do not feel good."},
  {t:"mcq",q:"A ______ is a talk between two people. It is not a speech.",opts:["conversation","helpline","change"],ans:"conversation",why:"A conversation goes two ways. You talk and then you listen."},
  {t:"mcq",q:"Good friends and family give us ______ every day.",opts:["support","a change","a helpline"],ans:"support",why:"Support is help that you give. Give support is a word partner."}
]},

{ n:2, group:"The words", title:"Words that go together", style:"Words",
  desc:"Word partners and two word verbs. These make your talk sound natural.",
  items:[
  {t:"mcq",q:"Which word goes with start?",opts:["a conversation","worried","thank you"],ans:"a conversation",why:"Start a conversation. You cannot start a worried."},
  {t:"mcq",q:"Which word goes with ask?",opts:["a question","support","a change"],ans:"a question",why:"Ask a question. This is step two in the conversation."},
  {t:"mcq",q:"Which word goes with notice?",opts:["a change","a helpline","thank you"],ans:"a change",why:"Notice a change. You need a thing you can see or hear."},
  {t:"mcq",q:"Which word goes with make?",opts:["time for a friend","a question","worried"],ans:"time for a friend",why:"Make time means you stop other things and you sit down."},
  {t:"mcq",q:"I ______ my neighbour every Friday. I knock on the door and say hello.",opts:["check in on","look after","open up"],ans:"check in on",why:"Check in on a person means you ask that person again later."},
  {t:"mcq",q:"Some people do not ______ on the first day. Give them time.",opts:["open up","reach out to","check in on"],ans:"open up",why:"Open up means you start to talk about your real feelings."},
  {t:"mcq",q:"You give a lot of support to other people. You also need to ______ yourself.",opts:["look after","open up","cheer up"],ans:"look after",why:"Look after yourself means take care of yourself. You come first too."},
  {t:"mcq",q:"A new student is in your class and knows nobody. Please ______ this person this week.",opts:["reach out to","open up","look after"],ans:"reach out to",why:"Reach out to a person means you make contact and you offer help."}
]},

{ n:3, group:"Listening", title:"Listen to the talk", style:"Listening", audio:"talk",
  desc:"Grace works at a community centre. Listen, then answer. You can listen again at any time.",
  items:[
  {t:"mcq",q:"What is the talk about?",opts:["What R U OK? Day is and how to ask the question.","How to get a job as a volunteer.","How to make an appointment with a doctor.","The colours people wear in September."],ans:"What R U OK? Day is and how to ask the question.",why:"The other three ideas are in the talk in a small way. They are not the main idea."},
  {t:"mcq",q:"R U OK? Day is on a Thursday this year.",opts:["True","False"],ans:"True",why:"Grace says Thursday the tenth of September."},
  {t:"mcq",q:"You must be a doctor to ask the question.",opts:["True","False"],ans:"False",why:"Grace says you do not need to be an expert. You are a friend, and a friend listens."},
  {t:"mcq",q:"How many steps are in the conversation?",opts:["three","four","five"],ans:"four",why:"Four steps for your friend: ask, listen, encourage action, check in. Your class talk has five. You add one step at the front: choose a quiet place."},
  {t:"mcq",q:"What is the colour for the day?",opts:["yellow","blue","green"],ans:"yellow",why:"Many people wear something yellow on that day."},
  {t:"mcq",q:"What is the number for Lifeline?",opts:["13 11 14","1300 22 4636","13 14 50"],ans:"13 11 14",why:"13 11 14 is Lifeline. It is open every day and every night."},
  {t:"mcq",q:"What is step four in the conversation?",opts:["check in again next week","ask the question","listen quietly"],ans:"check in again next week",why:"Ask, listen, encourage action, check in. Check in comes last."}
]},

{ n:4, group:"Listening", title:"Two speakers: A and B", style:"Listening", audio:"pres",

/* ============================================================
   3. STATE AND STORAGE
   ============================================================ */
var KEY = "vu23520_are_you_ok_ext_v1";
var ROSTER = "vu23520_are_you_ok_roster_v1";
var CLASSKEY = "vu23520_are_you_ok_class_v1";
var ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
var B36 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

var S = { name:"", ans:{}, ord:{}, seqp:{}, self:{}, recs:{}, view:{ v:"home" }, blocked:0, tsize:0 };
var STORE_OK = true;
var main, jump;

function storageProbe(){
  try{ localStorage.setItem("__p","1"); localStorage.removeItem("__p"); return true; }
  catch(e){ return false; }
}
function save(){
  if(!STORE_OK) return;
  try{
    localStorage.setItem(KEY, JSON.stringify({
      name:S.name, ans:S.ans, ord:S.ord, seqp:S.seqp, self:S.self, recs:S.recs, tsize:S.tsize
    }));
  }catch(e){}
}
function load(){
  if(!STORE_OK) return;
  try{
    var raw = localStorage.getItem(KEY); if(!raw) return;
    var o = JSON.parse(raw); if(!o) return;
    S.name = o.name||""; S.ans = o.ans||{}; S.ord = o.ord||{}; S.seqp = o.seqp||{};
    S.self = o.self||{}; S.recs = o.recs||{}; S.tsize = o.tsize||0;
  }catch(e){}
}
function readList(k){
  if(!STORE_OK) return [];
  try{ var r = localStorage.getItem(k); return r ? (JSON.parse(r)||[]) : []; }catch(e){ return []; }
}
function writeList(k, arr){
  if(!STORE_OK) return;
  try{ localStorage.setItem(k, JSON.stringify(arr)); }catch(e){}
}

/* ============================================================
   4. SMALL HELPERS
   ============================================================ */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shuffle(a){
  var i, j, t;
  for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function order(key, len){
  if(!S.ord[key]){
    var idx = [], i;
    for(i=0;i<len;i++) idx.push(i);
    S.ord[key] = shuffle(idx);
    save();
  }
  return S.ord[key];
}
function itemKey(p,i){ return p + "-" + i; }
function el(id){ return document.getElementById(id); }

/* ---- scoring ---- */
function partStats(pi){
  var P = PARTS[pi], done = 0, right = 0, i, k, a;
  for(i=0;i<P.items.length;i++){
    k = itemKey(P.n, i);
    if(P.items[i].t === "self"){ if(S.self[k]) { done++; if(S.self[k]==="yes") right++; } }
    else if(P.items[i].t === "rec"){ if(S.recs[P.items[i].id]) { done++; right++; } }
    else { a = S.ans[k]; if(a){ done++; if(a.ok) right++; } }
  }
  return { done:done, right:right, total:P.items.length };
}
function totalStats(){
  var d=0,r=0,t=0,i,s;
  for(i=0;i<9;i++){ s=partStats(i); d+=s.done; r+=s.right; t+=s.total; }
  return { done:d, right:r, total:t };
}
function anyProgress(){
  var i,s;
  for(i=0;i<PARTS.length;i++){ s=partStats(i); if(s.done>0) return true; }
  return false;
}

/* ---- report code: 11 letters (count per part) + 3 base36 (done mask) + 1 check ---- */
function makeCode(){
  var letters = "", mask = 0, i, s;
  for(i=0;i<PARTS.length;i++){
    s = partStats(i);
    letters += ALPHA.charAt(Math.min(s.right, 25));
    if(s.done === s.total) mask += Math.pow(2, i);
  }
  var m = "", v = mask, j;
  for(j=0;j<3;j++){ m = B36.charAt(v % 36) + m; v = Math.floor(v/36); }
  var body = letters + m, sum = 0;
  for(i=0;i<body.length;i++) sum += body.charCodeAt(i) * (i+1);
  return body + B36.charAt(sum % 36);
}
function readCode(code){
  var c = String(code).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length !== 15) return null;
  var body = c.substring(0,14), sum = 0, i;
  for(i=0;i<body.length;i++) sum += body.charCodeAt(i) * (i+1);
  if(B36.charAt(sum % 36) !== c.charAt(14)) return null;
  var mask = B36.indexOf(c.charAt(11))*1296 + B36.indexOf(c.charAt(12))*36 + B36.indexOf(c.charAt(13));
  var rows = [];
  for(i=0;i<11;i++){
    rows.push({
      n: PARTS[i].n, title: PARTS[i].title, right: ALPHA.indexOf(c.charAt(i)),
      total: PARTS[i].items.length, done: (mask & Math.pow(2,i)) ? true : false
    });
  }
  return rows;
}
function reportText(){
  var i, s, out = [], t = totalStats();
  out.push("Are You OK? Speak and Record");
  out.push("Student: " + (S.name || "no name"));
  out.push("Code: " + makeCode());
  out.push("Score in parts 1 to 9: " + t.right + " out of " + t.total);
  out.push("");
  for(i=0;i<PARTS.length;i++){
    s = partStats(i);
    if(PARTS[i].n === 10) out.push("Part 10 " + PARTS[i].title + ": " + s.done + " of 4 recordings made");
    else if(PARTS[i].n === 11) out.push("Part 11 " + PARTS[i].title + ": " + s.right + " Yes out of " + s.total);
    else out.push("Part " + PARTS[i].n + " " + PARTS[i].title + ": " + s.right + " right out of " + s.total + (s.done<s.total ? " (" + (s.total-s.done) + " not answered)" : ""));
  }
  return out.join("\n");
}

function setBar(title, pill){
  el("bTitle").textContent = title;
  el("bPill").textContent = pill;
}
function setNav(tip, backOn, nextLabel, nextClass, nextOn){
  el("navTip").textContent = tip || "";

  n.className = nextClass;

function scrollTop(){ window.scrollTo(0,0); }

/* ============================================================
   6. ROUTER
   ============================================================ */
function go(v, extra){
  S.view = { v:v };
  if(extra) for(var k in extra) S.view[k] = extra[k];
  S.blocked = 0;
  try{ if(typeof MIC !== "undefined" && MIC.id) stopRec(); }catch(e){}
  stopAllAudio();
  render();
  scrollTop();
}
function render(){
  var v = S.view.v;
  jump.className = "jump";
  if(v === "home") return renderHome();
  if(v === "part") return renderPart();
  if(v === "results") return renderResults();
  if(v === "teacher") return renderTeacher();
  if(v === "check") return renderCheck();
  if(v === "name") return renderName();
  if(v === "kb") return renderKB();
  if(v === "reset") return renderReset();
  renderHome();
}

/* ============================================================
   7. HOME
   ============================================================ */
function renderHome(){
  var t = totalStats(), i, s, h = [], lastGroup = "";
  setBar("Are You OK?", t.right + " / " + t.total);
  setNav("Tap a part to start. Your work is saved on this phone.", false, "Results", "go", true);

  h.push('<div class="wrap">');
  h.push('<p class="eyebrow">EAL Level 2 . Speaking practice</p>');
  h.push('<h1>Are You OK? Speak and Record</h1>');
  h.push('<p class="sub">Eleven parts. Nine parts you answer, one part you record, one part you check yourself. Your teacher sees your results at the end.</p>');

  if(!STORE_OK){
    h.push('<div class="warn"><strong>This phone is not saving your work.</strong> You can still do everything, but do not close this page. Finish, then send your results to your teacher.</div>');
  }
  h.push('<button class="mcard" data-a="name" type="button"><span class="step">Your name</span>'+
         '<span class="name">'+ (S.name ? esc(S.name) : "Tap here and put your name in") +'</span>'+
         '<span class="desc">Your teacher needs your name on your results.</span></button>');

  for(i=0;i<PARTS.length;i++){
    if(PARTS[i].group !== lastGroup){
      lastGroup = PARTS[i].group;
      h.push('<p class="grouphead">'+ esc(lastGroup) +'</p>');
    }
    s = partStats(i);
    var cls = "mcard" + (PARTS[i].mic ? " mic" : "");
    var lab, pcls = "score";
    if(s.done === 0) lab = s.total + " questions";
    else if(s.done < s.total){ lab = s.done + " of " + s.total + " answered"; pcls = "score part"; }
    else if(PARTS[i].n === 10){ lab = "4 recordings made"; pcls = "score full"; }
    else if(PARTS[i].n === 11){ lab = s.right + " Yes out of " + s.total; pcls = "score full"; }
    else { lab = s.right + " right out of " + s.total; pcls = "score full"; }
    h.push('<button class="'+cls+'" data-a="part" data-p="'+i+'" type="button">'+
      '<span class="step">Part '+ PARTS[i].n +' . '+ esc(PARTS[i].style) +'</span>'+
      '<span class="name">'+ esc(PARTS[i].title) +'</span>'+
      '<span class="desc">'+ esc(PARTS[i].desc) +'</span>'+
      '<span class="'+pcls+'">'+ lab +'</span></button>');
  }

  h.push('<p class="grouphead">When you finish</p>');
  h.push('<button class="big" data-a="results" type="button">See my results and send them to my teacher</button>');
  h.push('<button class="big gy" data-a="check" type="button">Check the microphone on this phone</button>');
  if(anyProgress()) h.push('<button class="big red" data-a="reset1" type="button">Start the whole thing again</button>');
  h.push('<button class="mini" data-a="teacher" type="button">Teacher</button>');
  h.push('</div>');
  main.innerHTML = h.join("");
}

/* ============================================================
   8. PART SCREEN
   ============================================================ */
function renderPart(){
  var pi = S.view.p, P = PARTS[pi], s = partStats(pi), i, h = [];
  setBar("Part " + P.n + ": " + P.title, s.right + " / " + s.total);

  h.push('<div class="wrap">');
  h.push('<div class="rhead"><span class="k">Part '+P.n+' . '+esc(P.style)+'</span>'+
    '<h1>'+esc(P.title)+'</h1><p class="d">'+esc(P.desc)+'</p>'+
    '<span class="live" id="live"></span>'+
    '<span class="pbar"><i id="pfill"></i></span></div>');

  if(P.audio) h.push(audioBlock(P.audio));
  if(P.mic) h.push(micIntro());

  for(i=0;i<P.items.length;i++) h.push(renderItem(P, i));

  if(P.n === 11){
    h.push('<div class="callout"><span class="lead">This part is not a test.</span>'+
      '<p>Your teacher wants to see what you think about your own talk. Answer Not yet when you know you can do it better.</p></div>');
  }
  h.push('<button class="big amb" data-a="retry" data-p="'+pi+'" type="button">Do this part again</button>');
  h.push('<button class="big gy" data-a="home" type="button">Back to the menu</button>');
  h.push('</div>');
  main.innerHTML = h.join("");
  refreshPart();
}

function renderItem(P, i){
  var it = P.items[i], k = itemKey(P.n, i), h = [], a = S.ans[k];
  var cls = "card";
  if(it.t === "mcq" || it.t === "seq"){ if(a){ cls += a.ok ? " ok" : " no"; } }
  if(it.t === "self" && S.self[k]) cls += " ok";
  if(it.t === "rec" && S.recs[it.id]) cls += " ok";

  h.push('<div class="card '+cls.substring(5)+'" id="c'+k+'" data-k="'+k+'">');
  h.push('<div class="chead"><span class="num">'+(i+1)+'</span><span class="tag">'+esc(P.style)+'</span></div>');

  if(it.t === "mcq"){
    h.push('<p class="q">'+esc(it.q)+'</p>');
    var ord = order(k, it.opts.length), j, o;
    for(j=0;j<ord.length;j++){
      o = it.opts[ord[j]];
      var ocls = "opt";
      if(a){

function findItem(k){

  for(j=0;j<PARTS.length;j++) if(PARTS[j].n === p) return { P:PARTS[j], pi:j, it:PARTS[j].items[i], i:i };
  return null;
}
function answerPick(k, v){

}
function answerSelf(k, v){ S.self[k] = v; save(); redrawItem(k); }
function clearItem(k){

}
function clearSelf(k){ delete S.self[k]; save(); redrawItem(k); }
function seqTap(k, v){
  var f = findItem(k); if(!f) return;

  picked.push(v); S.seqp[k] = picked;
  if(picked.length === f.it.strips.length){
    var ok = true, m;
    for(m=0;m<picked.length;m++) if(picked[m] !== m) ok = false;

}

var AUD = { elems:{}, speaking:false, rate:0.85, prate:1 };
var IOS = false;

function detectIOS(){
  var ua = navigator.userAgent || "";
  if(/iPad|iPhone|iPod/.test(ua)) return true;
  if(navigator.platform === "MacIntel" && (navigator.maxTouchPoints||0) > 1) return true;
  return /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR/.test(ua) && /Apple/.test(navigator.vendor||"");
}
function audioEl(id){
  if(AUD.elems[id]) return AUD.elems[id];

  a.setAttribute("playsinline",""); a.setAttribute("webkit-playsinline","");

}
function stopAllAudio(){
  var k;
  for(k in AUD.elems){ try{ AUD.elems[k].pause(); }catch(e){} }
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  AUD.speaking = false;
}
function pickVoice(){
  var vs = [], i, want = ["en-AU","en-GB","en-NZ","en-US","en"], w;
  try{ vs = window.speechSynthesis.getVoices() || []; }catch(e){ return null; }
  for(w=0;w<want.length;w++)
    for(i=0;i<vs.length;i++)
      if(vs[i].lang && vs[i].lang.indexOf(want[w]) === 0) return vs[i];

}
function playClip(kind){

/* ============================================================
   11. MICROPHONE
   Rules kept from the earlier recorder build:
   no audioSession, no mimeType argument, 250ms timeslice,
   wait for the last chunk after stop, elements in the document,
   context created and resumed inside a tap, tracks stopped after use.
   ============================================================ */
var MIC = {
  ctx:null, stream:null, mr:null, chunks:[], id:null, t0:0, timer:null,
  analyser:null, src:null, meterTimer:null, wav:null, peak:0
};
var REC = {};   /* id -> {blob, url, ms, type} */

function ensureCtx(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!MIC.ctx) MIC.ctx = new AC();
    if(MIC.ctx.state === "suspended" && MIC.ctx.resume) MIC.ctx.resume();
    return MIC.ctx;
  }catch(e){ return null; }
}
function firstTapCtx(){
  ensureCtx();
  document.removeEventListener("pointerdown", firstTapCtx, true);
  document.removeEventListener("touchstart", firstTapCtx, true);
  document.removeEventListener("click", firstTapCtx, true);
}
function secureOK(){
  if(location.protocol === "file:") return false;
  return (window.isSecureContext !== false);
}
function micSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function micMsg(e){
  var n = (e && e.name) ? e.name : "Error";
  if(n === "NotAllowedError") return IOS
    ? "The microphone is off for this page. Tap aA at the top of the browser, then Website Settings, then allow the Microphone."
    : "The microphone is blocked. Tap the padlock icon near the address bar and allow the Microphone.";
  if(n === "NotFoundError") return "This device has no microphone that the page can use.";
  if(n === "NotReadableError") return "Another app is using the microphone. Close it, then try again.";
  return "The microphone did not start. " + n + ".";
}
function setRecStatus(id, txt, rec){
  var s = el("st_"+id); if(!s) return;
  s.innerHTML = (rec ? '<span class="dot"></span>' : "") + esc(txt);
}
function startRec(id, secs){
  if(MIC.id){ stopRec(); return; }
  if(!secureOK()){
    setRecStatus(id, "This file was opened from the phone storage, so recording is off. Ask your teacher for the web link.");
    return;
  }
  if(!micSupported()){ setRecStatus(id, "This browser cannot record. Try Chrome or Safari."); return; }
  ensureCtx();
  setRecStatus(id, "Starting ...");
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    MIC.stream = stream; MIC.id = id; MIC.chunks = []; MIC.peak = 0;
    try{
      var ctx = ensureCtx();
      if(ctx){
        MIC.src = ctx.createMediaStreamSource(stream);
        MIC.analyser = ctx.createAnalyser();
        MIC.analyser.fftSize = 2048;
        MIC.src.connect(MIC.analyser);
        meterTick();
      }
    }catch(e){}
    var started = false;
    try{
      MIC.mr = new MediaRecorder(stream);   /* no mimeType on purpose */
      MIC.mr.ondataavailable = function(ev){ if(ev.data && ev.data.size) MIC.chunks.push(ev.data); };
      MIC.mr.onerror = function(ev){ setRecStatus(id, "The recorder stopped. " + ((ev.error&&ev.error.name)||"")); };
      MIC.mr.onstop = function(){ finishRec(id); };
      MIC.mr.start(250);
      started = true;
    }catch(e){
      started = startWav(id);
      if(!started){ setRecStatus(id, "This browser cannot record. " + (e.name||"")); cleanupMic(); return; }
    }
    MIC.t0 = Date.now();
    tick(id, secs);
    var btn = el("rb_"+id); if(btn){ btn.textContent = "Stop"; btn.className = "big red"; }
  }).catch(function(e){
    setRecStatus(id, micMsg(e));
    cleanupMic();
  });
}
function tick(id, secs){
  clearInterval(MIC.timer);
  MIC.timer = setInterval(function(){
    if(!MIC.id){ clearInterval(MIC.timer); return; }
    var s = Math.round((Date.now()-MIC.t0)/1000);
    setRecStatus(id, "Recording ... " + s + " seconds", true);
    if(secs && s >= secs) stopRec();
  }, 250);
}
function meterTick(){
  clearInterval(MIC.meterTimer);
  MIC.meterTimer = setInterval(function(){
    if(!MIC.analyser){ clearInterval(MIC.meterTimer); return; }
    var buf = new Uint8Array(MIC.analyser.fftSize), i, v, sum = 0, pk = 0;
    MIC.analyser.getByteTimeDomainData(buf);
    for(i=0;i<buf.length;i++){ v = (buf[i]-128)/128; sum += v*v; if(Math.abs(v)>pk) pk = Math.abs(v); }
    var rms = Math.sqrt(sum/buf.length);
    if(rms > MIC.peak) MIC.peak = rms;
    var m = el("mt_"+MIC.id);
    if(m) m.style.width = Math.min(100, Math.round(rms*260)) + "%";
  }, 120);
}
function startWav(id){
  try{
    var ctx = ensureCtx(); if(!ctx || !MIC.src) return false;
    var node = ctx.createScriptProcessor(4096, 1, 1);
    MIC.wav = { node:node, data:[], rate:ctx.sampleRate, len:0 };
    node.onaudioprocess = function(ev){
      var d = ev.inputBuffer.getChannelData(0), c = new Float32Array(d.length);
      c.set(d); MIC.wav.data.push(c); MIC.wav.len += c.length;
    };
    MIC.src.connect(node); node.connect(ctx.destination);
    return true;
  }catch(e){ return false; }
}
function wavBlob(){
  var w = MIC.wav, i, j, off = 44, n = w.len;
  var buf = new ArrayBuffer(44 + n*2), view = new DataView(buf);
  function str(o,s){ for(var q=0;q<s.length;q++) view.setUint8(o+q, s.charCodeAt(q)); }
  str(0,"RIFF"); view.setUint32(4, 36+n*2, true); str(8,"WAVE"); str(12,"fmt ");
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,w.rate,true); view.setUint32(28,w.rate*2,true);
  view.setUint16(32,2,true); view.setUint16(34,16,true); str(36,"data");
  view.setUint32(40, n*2, true);
  for(i=0;i<w.data.length;i++){
    for(j=0;j<w.data[i].length;j++){
      var s = Math.max(-1, Math.min(1, w.data[i][j]));
      view.setInt16(off, s<0 ? s*0x8000 : s*0x7FFF, true); off += 2;
    }
  }
  return new Blob([view], { type:"audio/wav" });
}
function stopRec(){
  if(!MIC.id) return;
  clearInterval(MIC.timer);
  var id = MIC.id;
  if(MIC.wav){
    try{ MIC.wav.node.disconnect(); }catch(e){}
    var b = wavBlob();
    MIC.wav = null;
    storeRec(id, b, Date.now()-MIC.t0, "audio/wav");
    cleanupMic(); return;
  }
  try{ MIC.mr.stop(); }catch(e){ finishRec(id); }
}
function finishRec(id){
  var tries = 0;
  (function waitChunks(){
    if(!MIC.chunks.length && tries < 12){ tries++; setTimeout(waitChunks, 20); return; }
    var type = (MIC.mr && MIC.mr.mimeType) ? MIC.mr.mimeType : (detectIOS() ? "audio/mp4" : "audio/webm");
    if(!type) type = detectIOS() ? "audio/mp4" : "audio/webm";
    var blob = new Blob(MIC.chunks, { type:type });
    var ms = Date.now() - MIC.t0;
    if(blob.size < 256){
      setRecStatus(id, "Nothing was recorded. Check the microphone, then record again.");
      cleanupMic(); return;
    }
    storeRec(id, blob, ms, type);
    cleanupMic();
  })();
}
function cleanupMic(){
  clearInterval(MIC.timer); clearInterval(MIC.meterTimer);
  try{ if(MIC.stream) MIC.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  try{ if(MIC.src) MIC.src.disconnect(); }catch(e){}
  MIC.stream = null; MIC.mr = null; MIC.src = null; MIC.analyser = null;
  MIC.chunks = []; var id = MIC.id; MIC.id = null;
  if(id){ var b = el("rb_"+id); if(b){ b.textContent = "Record"; b.className = "big amb"; } }
}
function storeRec(id, blob, ms, type){
  if(REC[id] && REC[id].url){ try{ URL.revokeObjectURL(REC[id].url); }catch(e){} }
  REC[id] = { blob:blob, url:URL.createObjectURL(blob), ms:ms, type:type };
  S.recs[id] = { ms:ms, type:type, size:blob.size, at:Date.now(), loud:Math.round(MIC.peak*100) };
  save(); idbPut(id, blob, type);
  redrawRec(id);
}
function dropRec(id){
  if(REC[id] && REC[id].url){ try{ URL.revokeObjectURL(REC[id].url); }catch(e){} }
  delete REC[id]; delete S.recs[id]; save(); idbDel(id); redrawRec(id);
}
function playRec(id){
  stopAllAudio();
  var r = REC[id];
  if(!r){ setRecStatus(id, "This recording is not on this phone any more. Record it again."); return; }
  var a = audioEl("rec_"+id);
  a.src = r.url;
  var p = a.play();
  if(p && p.catch) p.catch(function(e){ setRecStatus(id, "It did not play. " + (e.name||"")); });
}
function fileName(id){
  var nm = (S.name || "student").replace(/[^A-Za-z0-9 ]/g,"").replace(/\s+/g,"-");
  var ext = (REC[id] && REC[id].type && REC[id].type.indexOf("mp4") > -1) ? "m4a"
          : (REC[id] && REC[id].type && REC[id].type.indexOf("wav") > -1) ? "wav" : "webm";
  return nm + "-" + id + "." + ext;
}
function shareRec(id){
  var r = REC[id];
  if(!r){ setRecStatus(id, "There is no recording to send yet."); return; }
  var name = fileName(id);
  try{
    var f = new File([r.blob], name, { type:r.type });
    if(navigator.canShare && navigator.canShare({ files:[f] }) && navigator.share){
      navigator.share({ files:[f], title:name, text:"Talk from " + (S.name||"a student") })
        .catch(function(){ downloadRec(id); });
      return;
    }
  }catch(e){}
  downloadRec(id);
}
function downloadRec(id){
  var r = REC[id]; if(!r) return;
  var a = document.createElement("a");
  a.href = r.url; a.download = fileName(id);
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 500);
  setRecStatus(id, "Saved on this phone as " + fileName(id) + ". Now send that file to your teacher.");
}

/* ---- recordings kept between visits ---- */
var IDB = null;
function idbOpen(cb){
  if(!window.indexedDB){ cb(null); return; }
  try{
    var rq = indexedDB.open("ruok_recordings", 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore("clips"); };
    rq.onsuccess = function(){ IDB = rq.result; cb(IDB); };
    rq.onerror = function(){ cb(null); };
  }catch(e){ cb(null); }
}
function idbPut(id, blob, type){
  if(!IDB) return;
  try{ IDB.transaction("clips","readwrite").objectStore("clips").put({ blob:blob, type:type }, id); }catch(e){}
}
function idbDel(id){
  if(!IDB) return;
  try{ IDB.transaction("clips","readwrite").objectStore("clips").delete(id); }catch(e){}
}
function idbLoadAll(cb){
  if(!IDB){ cb(); return; }
  var ids = [], k;
  for(k in S.recs) ids.push(k);
  if(!ids.length){ cb(); return; }
  var left = ids.length;
  ids.forEach(function(id){
    try{
      var rq = IDB.transaction("clips","readonly").objectStore("clips").get(id);
      rq.onsuccess = function(){
        var v = rq.result;
        if(v && v.blob) REC[id] = { blob:v.blob, url:URL.createObjectURL(v.blob), ms:(S.recs[id]||{}).ms||0, type:v.type };
        if(--left === 0) cb();
      };
      rq.onerror = function(){ if(--left === 0) cb(); };
    }catch(e){ if(--left === 0) cb(); }
  });
}

  }

  h.push('</div>');
  h.push('<button class="big" data-a="kbdone" type="button">Done</button>');

function kbKey(v){
  if(KB.buf.length >= 40) return;
  KB.buf += v;
  var o = el("kbout"); if(o) o.textContent = KB.buf;
  if(KB.mode === "pin" && KB.buf.length === 4) kbDone();
}
function kbDel(){
  KB.buf = KB.buf.substring(0, KB.buf.length-1);
  var o = el("kbout"); if(o) o.textContent = KB.buf || " ";
}
function titleCase(s){
  return s.toLowerCase().replace(/(^|\s)([a-z])/g, function(m,a,b){ return a + b.toUpperCase(); }).replace(/\s+/g," ").replace(/^\s|\s$/g,"");
}
function kbDone(){
  if(KB.mode === "name"){ S.name = titleCase(KB.buf); save(); go("home"); return; }
  if(KB.mode === "class"){
    var list = readList(CLASSKEY);
    if(KB.buf.replace(/\s/g,"").length){ list.push(titleCase(KB.buf)); writeList(CLASSKEY, list); }
    go("teacher"); return;
  }
  if(KB.mode === "pin"){
    if(KB.buf === "2580"){ TEACHER_OK = true; go("teacher"); }
    else { KB.buf = ""; KB.sub = "That code is not right. Try again."; render(); }
    return;
  }
  if(KB.mode === "code"){
    var rows = readCode(KB.buf);
    if(!rows){ KB.buf = ""; KB.sub = "That code is not right. Check every letter and try again."; render(); return; }
    go("teacher", { rows:rows, code:KB.buf.toUpperCase().replace(/[^A-Z0-9]/g,"") });
    return;
  }
  go("home");
}

/* ============================================================
   18. EVENTS
   ============================================================ */
function act(node){
  var a = node.getAttribute("data-a");
  var k = node.getAttribute("data-k"), v = node.getAttribute("data-v"), id = node.getAttribute("data-i");
  if(a === "part"){ go("part", { p: parseInt(node.getAttribute("data-p"),10) }); return; }
  if(a === "home"){ go("home"); return; }
  if(a === "results"){ go("results"); return; }
  if(a === "check"){ go("check"); return; }
  if(a === "name"){ go("name"); return; }
  if(a === "pickname"){ S.name = v; save(); go("home"); return; }
  if(a === "kb"){ openKB(v); return; }
  if(a === "kbk"){ kbKey(v); return; }
  if(a === "kbdel"){ kbDel(); return; }
  if(a === "kbdone"){ kbDone(); return; }
  if(a === "teacher"){ if(TEACHER_OK) go("teacher"); else openKB("pin"); return; }
  if(a === "clearroster"){ writeList(ROSTER, []); render(); return; }
  if(a === "clearclass"){ writeList(CLASSKEY, []); render(); return; }
  if(a === "reset1"){ go("reset"); return; }
  if(a === "reset2"){ doReset(); return; }
  if(a === "share"){ shareResults(); return; }
  if(a === "copy"){ copyResults(); return; }
  if(a === "saveme"){ saveToDevice(); return; }
  if(a === "pick"){ answerPick(k, v); return; }
  if(a === "clear"){ clearItem(k); return; }
  if(a === "self"){ answerSelf(k, v); return; }
  if(a === "selfclear"){ clearSelf(k); return; }
  if(a === "seq"){ seqTap(k, parseInt(v,10)); return; }
  if(a === "sequndo"){ seqUndo(k); return; }
  if(a === "retry"){ retryPart(parseInt(node.getAttribute("data-p"),10)); return; }
  if(a === "play"){ playClip(node.getAttribute("data-c")); return; }
  if(a === "stop"){ stopAllAudio(); return; }
  if(a === "slow"){ AUD.rate = Math.max(0.5, AUD.rate - 0.15); AUD.prate = Math.max(0.6, AUD.prate - 0.15); note("Slower. Tap Play again."); return; }
  if(a === "fast"){ AUD.rate = Math.min(1.2, AUD.rate + 0.15); AUD.prate = Math.min(1.3, AUD.prate + 0.15); note("Faster. Tap Play again."); return; }
  if(a === "rec"){ if(MIC.id) stopRec(); else startRec(id, parseInt(node.getAttribute("data-s"),10)); return; }
  if(a === "playrec"){ playRec(id); return; }
  if(a === "sharerec"){ shareRec(id); return; }
  if(a === "droprec"){ dropRec(id); return; }
  if(a === "skip"){ nextPart(); return; }
}
function retryPart(pi){
  var P = PARTS[pi], i, k;
  for(i=0;i<P.items.length;i++){
    k = itemKey(P.n, i);
    delete S.ans[k]; delete S.seqp[k]; delete S.ord[k]; delete S.self[k];
  }
  save(); go("part", { p:pi }); 
}
function nextPart(){
  var pi = S.view.p;
  if(pi < PARTS.length - 1) go("part", { p:pi+1 });
  else go("results");
}

function bind(){
  main.addEventListener("click", function(ev){
    var n = ev.target;
    while(n && n !== main && !n.getAttribute("data-a")) n = n.parentNode;
    if(n && n !== main && n.getAttribute("data-a")) act(n);
  });
  jump.addEventListener("click", function(){ goToFirstUnanswered(); });
  el("bMenu").addEventListener("click", function(){ go("home"); });
  el("bText").addEventListener("click", function(){
    S.tsize = (S.tsize + 1) % 3;
    document.body.className = S.tsize === 1 ? "t30" : (S.tsize === 2 ? "t36" : "");
    save();
  });
  el("bFull").addEventListener("click", function(){
    try{
      if(!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      else if(document.exitFullscreen) document.exitFullscreen();
    }catch(e){}
  });
  el("navBack").addEventListener("click", function(){
    if(S.view.v === "part"){ if(S.view.p > 0) go("part", { p:S.view.p-1 }); else go("home"); }
    else go("home");
  });
  el("navNext").addEventListener("click", function(){
    if(S.view.v === "home"){ go("results"); return; }
    if(S.view.v !== "part"){ go("home"); return; }
    var s = partStats(S.view.p);
    if(s.done < s.total){ S.blocked++; goToFirstUnanswered(); refreshPart(); return; }
    nextPart();
  });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape") go("home");
    if(S.view.v === "part"){
      if(ev.key === "ArrowLeft") el("navBack").click();
      if(ev.key === "ArrowRight") el("navNext").click();
    }
  });
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) save(); });
  setInterval(save, 1500);
  document.addEventListener("pointerdown", firstTapCtx, true);
  document.addEventListener("touchstart", firstTapCtx, true);
  document.addEventListener("click", firstTapCtx, true);
  try{ if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function(){}; }catch(e){}
}

function boot(){
  main = el("main"); jump = el("jump");
  STORE_OK = storageProbe();
  IOS = detectIOS();
  load();
  document.body.className = S.tsize === 1 ? "t30" : (S.tsize === 2 ? "t36" : "");
  bind();
  render();
  idbOpen(function(){ idbLoadAll(function(){ if(S.view.v === "part") render(); }); });
}
